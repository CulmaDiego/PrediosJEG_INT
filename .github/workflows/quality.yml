name: Calidad
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-quality.txt
      - name: Verificar calidad
        run: .\scripts\VERIFICAR_CALIDAD.ps1 -Python python -InstallDependencies
